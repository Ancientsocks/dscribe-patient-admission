databases:
  - name: dscribe-db
    plan: free
    databaseName: dscribe
    user: dscribe

services:
  - type: web
    name: dscribe-patient-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dscribe-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: DOCTORS
        sync: false
